name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Soroban contract (build + test + WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          targets: wasm32v1-none

      # Prebuilt release binary, pinned by version + SHA-256. We intentionally do
      # NOT `cargo install` it: stellar-cli 26.1.0 needs rustc >= 1.93 to compile,
      # while the contract toolchain must stay at the pinned 1.91.1 (the fixture
      # WASM hash in docker/toolchain-manifest.json was derived with it). The CLI
      # binary's own compiler has no effect on contract codegen — `stellar
      # contract build` shells out to the pinned cargo/rustc on PATH.
      - name: Install stellar-cli (pinned binary)
        run: |
          curl -fsSL -o stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v26.1.0/stellar-cli-26.1.0-x86_64-unknown-linux-gnu.tar.gz
          echo "e18d5a7629102e1ccc07241acbcbebfc05b1c02476ce7d3204ba2d7418be5c0c  stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf stellar-cli.tar.gz stellar
          sudo mv stellar /usr/local/bin/stellar
          rm stellar-cli.tar.gz
          stellar version

      - name: cargo test (--locked)
        run: cargo test --locked

      - name: Reproducible WASM build (--locked)
        run: stellar contract build --locked

      - name: Print WASM SHA-256
        run: shasum -a 256 target/wasm32v1-none/release/hello_soroban.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello_soroban.wasm
          path: contracts/target/wasm32v1-none/release/hello_soroban.wasm

  reader:
    name: Chain reader + verify CLI (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: reader/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests (no network)
        run: pnpm test

      - name: Build
        run: pnpm run build

  # Live testnet integration is opt-in (requires network to soroban-testnet RPC).
  # Runs only on main to avoid flaky PR failures from RPC availability.
  integration:
    name: Live testnet integration (opt-in)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: reader
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: reader/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Live chain-read test against deployed fixture
        env:
          SOROSCAN_INTEGRATION: "1"
        run: pnpm exec vitest run test/integration.testnet.test.ts
